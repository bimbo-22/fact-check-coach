<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fact-Check Coach</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>🧭 Fact-Check Coach</h1>
    <p class="tagline">Guess first. Then check the evidence.</p>
  </header>

  <section id="input-view">
    <div class="tabs" role="tablist">
      <button id="tab-post" class="tab active" role="tab" aria-selected="true">Check a post</button>
      <button id="tab-comments" class="tab" role="tab" aria-selected="false">Check comments</button>
    </div>
    <button id="check-ig" class="secondary" hidden>Check this Instagram post</button>
    <button id="check-ig-comments" class="secondary" hidden>Read this post's comments</button>
    <label id="text-label" for="post-text">Paste a caption or post text</label>
    <textarea id="post-text" rows="5" maxlength="4000" placeholder="e.g. Scientists CONFIRM 5G towers make people sick!!! link in bio"></textarea>
    <label for="image-input">…or add a screenshot</label>
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" />
    <button id="check-btn">Check it</button>
  </section>

  <section id="comments-view" hidden></section>

  <section id="start-view" hidden>
    <p class="label">The claim</p>
    <p id="claim" class="claim"></p>
    <p id="question" class="question"></p>
    <p class="label">What's your guess?</p>
    <div class="guesses">
      <button data-guess="true">True</button>
      <button data-guess="false">False</button>
      <button data-guess="not_sure">Not sure</button>
    </div>
  </section>

  <section id="reveal-view" hidden></section>

  <div id="note" class="note" hidden></div>
  <p id="status" class="status" role="status"></p>

  <details id="settings">
    <summary>Settings</summary>
    <label for="api-base">API address</label>
    <input id="api-base" type="url" />
    <button id="save-api" class="secondary">Save</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
