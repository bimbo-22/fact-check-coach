# The ONLY outlets whose articles count as evidence (13 since 2026-10-24; was 6).
# Bias labels come from AllSides (perceived political lean, NOT accuracy).
# bias_status: confirmed = seen on/through allsides.com on bias_checked date; unconfirmed = a human must check.
bias_checked: "2026-10-24"

outlets:
  - id: reuters
    name: Reuters Fact Check
    domains: [reuters.com]
    path_hint: /fact-check/
    type: wire_service
    bias_label: Center
    bias_source: AllSides
    bias_status: confirmed
    bias_note: "AllSides: Center, high confidence."
  - id: ap
    name: AP Fact Check
    domains: [apnews.com]
    path_hint: /hub/ap-fact-check
    type: wire_service
    bias_label: Left
    bias_source: AllSides
    bias_status: unconfirmed
    bias_note: "AllSides 2023 blind survey said Lean Left; a third-party list says Left. Check allsides.com."
  - id: afp
    name: AFP Fact Check
    domains: [factcheck.afp.com, factuel.afp.com]   # English + French editions
    path_hint: null
    type: fact_checker
    bias_label: Center
    bias_source: AllSides
    bias_status: unconfirmed
    bias_note: "No AllSides rating found for AFP. Check allsides.com or mark as unrated."
  - id: bbc
    name: BBC Verify
    domains: [bbc.com, bbc.co.uk]
    path_hint: /news/
    type: public_broadcaster
    bias_label: Center
    bias_source: AllSides
    bias_status: confirmed
    bias_note: "AllSides: Center (kept in the 2024 chart update)."
  - id: snopes
    name: Snopes
    domains: [snopes.com]
    path_hint: /fact-check/
    type: fact_checker
    bias_label: Lean Left
    bias_source: AllSides
    bias_status: confirmed
    bias_note: "AllSides: Lean Left, medium confidence (a 2020 review had said Center)."
  - id: politifact
    name: PolitiFact
    domains: [politifact.com]
    path_hint: /factchecks/
    type: fact_checker
    bias_label: Lean Left
    bias_source: AllSides
    bias_status: confirmed
    bias_note: "AllSides: Lean Left, low/initial confidence."

